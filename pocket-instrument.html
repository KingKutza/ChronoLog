<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ece5d8">
  <title>Chronolog</title>
  <link rel="stylesheet" href="./src/app.css">
</head>
<body>
  <main id="app">
    <header id="hud" aria-label="Chronolog controls">
      <div id="brand">Chronolog</div>
      <button class="instrument-button primary" id="new-event" type="button">New event</button>
      <button class="instrument-button optional" id="new-frame" type="button">New frame</button>
      <button class="instrument-button optional" id="new-pattern" type="button">New pattern</button>
      <select class="select-control" id="active-calendar" aria-label="Active calendar"></select>
      <button class="icon-button" id="today" type="button" title="Go to today">◎</button>
      <label class="status-chip optional" title="Keep one focus coordinate between projections">
        <input id="shared-focus" type="checkbox" checked>
        shared date
      </label>
      <button class="icon-button" id="undo" type="button" title="Undo">↶</button>
      <button class="icon-button" id="redo" type="button" title="Redo">↷</button>
      <button class="instrument-button optional" id="open-document" type="button">Open</button>
      <button class="instrument-button optional" id="save-document" type="button">Save as</button>
      <button class="instrument-button optional" id="import-ics" type="button">Import ICS</button>
      <button class="instrument-button optional" id="export-ics" type="button">Export ICS</button>
      <span id="save-status" class="status-chip" data-state="clean">Saved</span>
    </header>

    <nav id="projection-dial" aria-label="Projection">
      <button type="button" data-projection="calendar" title="Calendar scale">▦</button>
      <button type="button" data-projection="wall" title="Wall calendar">▤</button>
      <button type="button" data-projection="lines" title="Timeline topology">⌁</button>
      <button type="button" data-projection="radial" title="Radial cycles">◉</button>
    </nav>

    <aside id="scale-rail" aria-label="Scale">
      <input id="scale" type="range" min="0" max="2" step="0.01" value="1"
        orient="vertical" aria-label="Continuous time scale">
      <button class="detent" data-scale="2" type="button">Strategic</button>
      <button class="detent" data-scale="1" type="button">Tactical</button>
      <button class="detent" data-scale="0" type="button">Intimate</button>
    </aside>

    <section id="viewport" aria-live="polite">
      <div id="projection"></div>
    </section>

    <div id="focus-readout"></div>
    <div id="minimap" title="Click or drag to move the shared focus"></div>

    <aside id="inspector" aria-label="Object inspector">
      <header class="inspector-head">
        <h2 id="inspector-title">Inspector</h2>
        <button class="icon-button" id="close-inspector" type="button" aria-label="Close inspector">×</button>
      </header>
      <div id="inspector-body"></div>
    </aside>

    <input id="document-file" type="file" accept=".json,.chronolog.json,application/json" hidden>
    <input id="ics-file" type="file" accept=".ics,text/calendar" multiple hidden>
    <div id="toast" role="status"></div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
