<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ece5d8">
  <title>ChronoLog</title>
  <link rel="icon" href="./assets/chronolog-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/app.css">
</head>
<body>
  <main id="app">
    <header id="hud" aria-label="ChronoLog controls">
      <div id="brand" aria-label="ChronoLog: a timeline instrument"><svg class="chronolog-mark" viewBox="0 0 32 32" role="img" aria-labelledby="chronolog-mark-title">
        <title id="chronolog-mark-title">Interlocking timeline frames joined by a staple</title>
        <path class="chronolog-mark__frame chronolog-mark__frame--primary" d="M4 6h7c3.3 0 6 2.7 6 6v14"></path>
        <path class="chronolog-mark__frame chronolog-mark__frame--secondary" d="M28 26h-7c-3.3 0-6-2.7-6-6V6"></path>
        <path class="chronolog-mark__staple" d="M12 16h8"></path>
        <circle class="chronolog-mark__join" cx="16" cy="16" r="2.1"></circle>
      </svg><span class="chronolog-wordmark">Chrono<span>Log</span></span></div>
      <details id="create-menu">
        <summary aria-label="Create an object"><span class="responsive-label-long">New</span><span class="responsive-label-short" aria-hidden="true">+</span></summary>
        <div class="create-menu-panel">
          <button class="instrument-button" id="new-event" type="button"><strong>Event</strong><small>A scheduled point or span</small></button>
          <button class="instrument-button" id="new-todo" type="button"><strong>ToDo</strong><small>A zero-duration task</small></button>
          <button class="instrument-button" id="new-note" type="button"><strong>Note</strong><small>A note pinned in time</small></button>
        </div>
      </details>
      <button class="instrument-button optional" id="new-frame" type="button" aria-controls="inspector" aria-expanded="false">Frames</button>
      <select class="select-control" id="active-calendar" aria-label="Active calendar"></select>
      <div class="history-controls" aria-label="Edit history">
        <button class="icon-button" id="undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)">↶</button>
        <button class="icon-button" id="redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo (Ctrl+Shift+Z)">↷</button>
      </div>
      <span id="save-status" class="status-chip" data-state="clean" role="status" aria-live="polite" aria-label="Save status" title="Current save status">Saved</span>
      <details id="document-menu">
        <summary title="Document actions" aria-label="Document actions"><span class="responsive-label-long">Document</span><span class="responsive-label-short" aria-hidden="true">⋮</span></summary>
        <div class="document-menu-panel">
          <button class="instrument-button" id="manage-frames" type="button" aria-controls="inspector" aria-expanded="false">Frames workspace</button>
          <button class="instrument-button" id="theme-settings" type="button">Color theme</button>
          <button class="instrument-button" id="lens-settings" type="button">Configure lenses</button>
          <button class="instrument-button" id="new-pattern" type="button">Advanced patterns</button>
          <label class="status-chip" title="Keep one focus coordinate between projections"><input id="shared-focus" type="checkbox" checked>shared date</label>
          <button class="instrument-button" id="open-document" type="button">Open document</button>
          <button class="instrument-button" id="save-document" type="button">Save now</button>
          <button class="instrument-button" id="save-as-document" type="button">Save as</button>
          <button class="instrument-button" id="download-conflict" type="button" disabled>Download conflict copy</button>
          <button class="instrument-button" id="reload-latest" type="button" disabled>Reload latest workspace</button>
          <button class="instrument-button" id="import-ics" type="button">Import ICS</button>
          <button class="instrument-button" id="export-ics" type="button">Export ICS</button>
        </div>
      </details>
    </header>

    <nav id="lens-bar" aria-label="Time lens">
      <button type="button" data-lens="intimate" aria-label="Intimate"><span class="responsive-label-long">Intimate</span><span class="responsive-label-short" aria-hidden="true">Int</span></button>
      <button type="button" data-lens="tactical" aria-label="Tactical"><span class="responsive-label-long">Tactical</span><span class="responsive-label-short" aria-hidden="true">Tac</span></button>
      <button type="button" data-lens="strategic" aria-label="Strategic"><span class="responsive-label-long">Strategic</span><span class="responsive-label-short" aria-hidden="true">Strat</span></button>
      <button type="button" data-lens="wall" aria-label="Wall"><span class="responsive-label-long">Wall</span><span class="responsive-label-short" aria-hidden="true">Wall</span></button>
      <button type="button" data-lens="lines" aria-label="Lines"><span class="responsive-label-long">Lines</span><span class="responsive-label-short" aria-hidden="true">Lines</span></button>
      <button type="button" data-lens="spiral" aria-label="Spiral"><span class="responsive-label-long">Spiral</span><span class="responsive-label-short" aria-hidden="true">Spir</span></button>
      <button type="button" data-lens="radial" aria-label="Radial"><span class="responsive-label-long">Radial</span><span class="responsive-label-short" aria-hidden="true">Rad</span></button>
    </nav>

    <section id="lens-controls" aria-label="Lens window controls"></section>

    <section id="viewport" aria-live="polite">
      <div id="projection"></div>
    </section>

    <div id="focus-readout"></div>
    <div id="minimap" title="Drag the outlined view window. Layered color shows event density; red is now and black is the view center."></div>

    <aside id="inspector" aria-label="Object inspector">
      <header class="inspector-head">
        <h2 id="inspector-title">Inspector</h2>
        <button class="icon-button" id="close-inspector" type="button" aria-label="Close inspector">×</button>
      </header>
      <div id="inspector-body"></div>
    </aside>

    <input id="document-file" type="file" accept=".chronolog,.json,application/x-chronolog,application/json" hidden>
    <input id="ics-file" type="file" accept=".ics,text/calendar" multiple hidden>
    <div id="toast" role="status"></div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
